<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- The page's own background in each scheme, so Safari's bars and the status bar continue it. -->
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wallet" />
    <title>Goblin Wallet</title>
    <!-- The public landing at / (pages/landing): what a search engine and a link preview show. Same on every stage. -->
    <meta
      name="description"
      content="Goblin Wallet pays for your AI agent's searches, services and transfers in USDC, inside limits the chain and the signer enforce. Anyone new waits for your yes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Goblin Wallet" />
    <meta property="og:url" content="https://wallet.goblin.surf/" />
    <meta property="og:title" content="Goblin Wallet: your agent can pay, within limits you set" />
    <meta
      property="og:description"
      content="USDC payments for AI agents. Every limit names who enforces it, gas is paid in USDC, and anyone new waits for your yes."
    />
    <meta property="og:image" content="https://wallet.goblin.surf/wallet-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Goblin Wallet: your agent can pay. Within limits you set." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Goblin Wallet: your agent can pay, within limits you set" />
    <meta
      name="twitter:description"
      content="USDC payments for AI agents. Every limit names who enforces it, gas is paid in USDC, and anyone new waits for your yes."
    />
    <meta name="twitter:image" content="https://wallet.goblin.surf/wallet-og.png" />
    <script>
      ;(function () {
        try {
          var m = matchMedia('(prefers-color-scheme: dark)')
          var a = function () {
            var r = document.documentElement
            r.classList.toggle('dark', m.matches)
            r.style.colorScheme = m.matches ? 'dark' : 'light'
          }
          a()
          m.addEventListener('change', a)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
